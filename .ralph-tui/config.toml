configVersion = "2.1"
autoCommit = true
tracker = "beads-resume"
defaultAgent = "claude"
defaultTracker = "beads-resume"
maxIterations = 20
agent = "claude"
model = "opus"
prompt_template = ".ralph-tui/prompt.hbs"
subagentTracingDetail = "off"

[agentOptions]
fullAuto = false
sandbox = "danger-full-access"

[trackerOptions]
beadsDir = ".beads"
labels = ""

[errorHandling]
strategy = "retry"
maxRetries = 2
retryDelayMs = 2000
