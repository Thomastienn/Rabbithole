configVersion = "2.1"
defaultAgent = "codex"
defaultTracker = "beads-resume"
maxIterations = 20
agent = "codex"
model = "gpt-6.1-terra"
tracker = "beads-resume"
prompt_template = ".ralph-tui/prompt.hbs"
autoCommit = true
subagentTracingDetail = "full"

[agentOptions]
fullAuto = false

[trackerOptions]
beadsDir = ".beads"
labels = ""

[errorHandling]
strategy = "retry"
maxRetries = 2
retryDelayMs = 2000
