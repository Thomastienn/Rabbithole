# Builds the unsigned desktop installers and smoke-tests each. Manual trigger only: the owner runs it (AGENTS.md).
name: Desktop build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    # The oldest supported runner, so the AppImage runs on older glibc.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json
      - name: Cache Electron downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: electron-${{ runner.os }}-${{ hashFiles('desktop/package-lock.json') }}
          restore-keys: electron-${{ runner.os }}-
      # The stage builds pycairo and manimpango against Cairo and Pango.
      - name: Install the stage's Linux prerequisites
        run: sudo apt-get update && sudo apt-get install -y libcairo2-dev libpango1.0-dev pkg-config
      - run: npm ci
      - run: npm run desktop:build
      # Opens the AppImage's own output without FUSE or a display; bubblewrap is the sandbox the learner installs.
      - name: Smoke-test the AppImage
        run: |
          sudo apt-get install -y bubblewrap
          (cd "$RUNNER_TEMP" && "$GITHUB_WORKSPACE"/desktop/dist/*.AppImage --appimage-extract > /dev/null)
          node scripts/desktop-smoke.mjs "$RUNNER_TEMP/squashfs-root/resources"
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: desktop/dist/*.AppImage
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/sandbox -> target
      - name: Cache Electron downloads
        uses: actions/cache@v4
        with:
          path: |
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: electron-${{ runner.os }}-${{ hashFiles('desktop/package-lock.json') }}
          restore-keys: electron-${{ runner.os }}-
      # Cargo's libgit2 checkout of the Codex sources exceeds Windows' 260-character path limit.
      - run: git config --global core.longpaths true
      - run: npm ci
      - run: npm run desktop:build
      # Installs per user as a learner would; runners have admin rights, so the sandbox setup's UAC prompt passes.
      - name: Smoke-test the installer
        shell: pwsh
        run: |
          Start-Process -FilePath (Get-Item desktop/dist/*-setup.exe).FullName -ArgumentList '/S' -Wait
          # Without a path the smoke test would check desktop/stage instead of the installed app.
          $resources = (Get-Item "$env:LOCALAPPDATA/Programs/*/resources/node.exe").DirectoryName
          if (-not $resources) { throw 'The installer did not install the app.' }
          node scripts/desktop-smoke.mjs $resources
      # The launcher and its setup helper log here (desktop/sandbox/src/main.rs, sandbox_home).
      - name: Show the sandbox logs
        if: failure()
        shell: pwsh
        run: |
          Get-ChildItem "$env:LOCALAPPDATA/rabbithole/sandbox" -Recurse -Force -Include *.log, setup_error.json -ErrorAction SilentlyContinue |
            ForEach-Object { "== $($_.FullName)"; Get-Content $_.FullName -Tail 400 }
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: desktop/dist/*-setup.exe
          if-no-files-found: error
      # npm start on Windows downloads this zip (SANDBOX_RELEASE in scripts/tools-setup.mjs); the log prints its SHA-256.
      - name: Zip the sandbox launcher for npm start
        shell: pwsh
        run: |
          $bins = 'rabbithole-sandbox', 'codex-command-runner', 'codex-windows-sandbox-setup' | ForEach-Object { "desktop/sandbox/target/release/$_.exe" }
          Compress-Archive -Path $bins -DestinationPath rabbithole-sandbox-windows-x64.zip
          (Get-FileHash rabbithole-sandbox-windows-x64.zip -Algorithm SHA256).Hash.ToLower()
      - uses: actions/upload-artifact@v4
        with:
          name: windows-sandbox
          path: rabbithole-sandbox-windows-x64.zip
          if-no-files-found: error

  release:
    needs: [linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      # Fixed names so the README's releases/latest/download links never change.
      - name: Rename installers
        run: |
          mv installers/*.AppImage installers/Rabbithole-linux-x86_64.AppImage
          mv installers/*-setup.exe installers/Rabbithole-windows-x64-setup.exe
      # A draft: the owner reviews, renames the tag if wanted and publishes it by hand.
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "desktop-build-${{ github.run_number }}" installers/*
          --repo "${{ github.repository }}" --target "${{ github.sha }}" --draft
          --title "Rabbithole desktop build ${{ github.run_number }}"
          --notes "Unsigned AppImage and Windows installer from ${{ github.sha }}."
