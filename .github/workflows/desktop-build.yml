# Builds the unsigned desktop installers and smoke-tests each. Manual trigger only: the owner runs it (AGENTS.md).
name: Desktop build

on:
  workflow_dispatch:

permissions:
  contents: read

# One release at a time: a second run waits, so two runs never race the pin or the tag.
concurrency:
  group: desktop-build

jobs:
  # Runs first: the app's own install code for Claude Code and Codex on Windows, as the Install button runs it.
  # Every other job needs it, directly or through wheels-check, so a broken install stops the run.
  install-check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/install-check.mjs

  # Installed apps read LINUX_WHEELS when they install video tools, so a pinned version the wheels release lacks is built first.
  wheels-check:
    needs: install-check
    # A run from another branch only builds, like the release job.
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    outputs:
      rebuild: ${{ steps.check.outputs.rebuild }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A missing release lists no wheels, so every pin counts as missing.
          gh release view linux-wheels --repo "${{ github.repository }}" --json assets -q '.assets[].name' > "$RUNNER_TEMP/assets" || : > "$RUNNER_TEMP/assets"
          missing=$(node scripts/linux-wheels-pin.mjs missing "$RUNNER_TEMP/assets")
          echo "Pinned wheels the release lacks: ${missing:-none}"
          echo "rebuild=${missing:+true}" >> "$GITHUB_OUTPUT"

  wheels:
    needs: wheels-check
    if: needs.wheels-check.outputs.rebuild == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/linux-wheels.yml

  # A failed wheel build stops it, so it changes no pin. It also runs without a rebuild: a wheel released by hand
  # or by a run that failed before its pin push still gets its name and hash pinned.
  wheel-pin:
    needs: wheels
    if: ${{ !failure() && !cancelled() && github.ref == 'refs/heads/master' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.pin.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
      - id: pin
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          gh release download linux-wheels --repo "${{ github.repository }}" -p SHA256SUMS -D "$RUNNER_TEMP"
          node scripts/linux-wheels-pin.mjs pin "$RUNNER_TEMP/SHA256SUMS"
          if git diff --quiet -- scripts/manim-setup.mjs; then
            echo "The wheel pins already match the release."
          else
            git commit -qm "chore: pin the Linux wheels" -- scripts/manim-setup.mjs
            pinned=$(git rev-parse HEAD)
            # The pin stays on master even if the installers fail, since the wheels it names exist. If master moved,
            # the pin lands on top of it and the installers build from that commit: no other ref holds the first one.
            git push origin HEAD:refs/heads/master || {
              git fetch origin master
              git checkout -q FETCH_HEAD
              git cherry-pick "$pinned"
              git push origin HEAD:refs/heads/master
            }
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  linux:
    needs: wheel-pin
    # Also runs from another branch, where wheel-pin is skipped; a failed wheel build or pin stops it.
    if: ${{ !failure() && !cancelled() }}
    # The oldest supported runner, so the AppImage runs on older glibc.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.wheel-pin.outputs.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json
      - name: Cache Electron downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: electron-${{ runner.os }}-${{ hashFiles('desktop/package-lock.json') }}
          restore-keys: electron-${{ runner.os }}-
      - run: npm ci
      # The updater compares versions, so every build gets a newer one without a hand bump.
      - name: Stamp the version
        working-directory: desktop
        run: npm version "1.0.${{ github.run_number }}" --no-git-tag-version
      - run: npm run desktop:build
      # Opens the AppImage's own output without FUSE or a display; bubblewrap is the sandbox the learner installs.
      - name: Smoke-test the AppImage
        run: |
          sudo apt-get update && sudo apt-get install -y bubblewrap
          (cd "$RUNNER_TEMP" && "$GITHUB_WORKSPACE"/desktop/dist/*.AppImage --appimage-extract > /dev/null)
          node scripts/desktop-smoke.mjs "$RUNNER_TEMP/squashfs-root/resources"
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          # The AppImage embeds its blockmap; latest-linux.yml is the updater's metadata.
          path: |
            desktop/dist/*.AppImage
            desktop/dist/latest-linux.yml
          if-no-files-found: error

  windows:
    needs: wheel-pin
    if: ${{ !failure() && !cancelled() }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.wheel-pin.outputs.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/sandbox -> target
      - name: Cache Electron downloads
        uses: actions/cache@v4
        with:
          path: |
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: electron-${{ runner.os }}-${{ hashFiles('desktop/package-lock.json') }}
          restore-keys: electron-${{ runner.os }}-
      # Cargo's libgit2 checkout of the Codex sources exceeds Windows' 260-character path limit.
      - run: git config --global core.longpaths true
      - run: npm ci
      # The updater compares versions, so every build gets a newer one without a hand bump.
      - name: Stamp the version
        working-directory: desktop
        run: npm version "1.0.${{ github.run_number }}" --no-git-tag-version
      - run: npm run desktop:build
      # Installs per user as a learner would; runners have admin rights, so the sandbox setup's UAC prompt passes.
      - name: Smoke-test the installer
        shell: pwsh
        run: |
          Start-Process -FilePath (Get-Item desktop/dist/*-setup.exe).FullName -ArgumentList '/S' -Wait
          # Without a path the smoke test would check desktop/stage instead of the installed app.
          $resources = (Get-Item "$env:LOCALAPPDATA/Programs/*/resources/node.exe").DirectoryName
          if (-not $resources) { throw 'The installer did not install the app.' }
          node scripts/desktop-smoke.mjs $resources
      # The launcher and its setup helper log here (desktop/sandbox/src/main.rs, sandbox_home).
      - name: Show the sandbox logs
        if: failure()
        shell: pwsh
        run: |
          Get-ChildItem "$env:LOCALAPPDATA/rabbithole/sandbox" -Recurse -Force -Include *.log, setup_error.json -ErrorAction SilentlyContinue |
            ForEach-Object { "== $($_.FullName)"; Get-Content $_.FullName -Tail 400 }
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            desktop/dist/*-setup.exe
            desktop/dist/*-setup.exe.blockmap
            desktop/dist/latest.yml
          if-no-files-found: error
      # npm start on Windows downloads this zip (SANDBOX_RELEASE in scripts/tools-setup.mjs); the release job re-pins it.
      - name: Zip the sandbox launcher for npm start
        shell: pwsh
        run: |
          $bins = 'rabbithole-sandbox', 'codex-command-runner', 'codex-windows-sandbox-setup' | ForEach-Object { "desktop/sandbox/target/release/$_.exe" }
          Compress-Archive -Path $bins -DestinationPath rabbithole-sandbox-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows-sandbox
          path: rabbithole-sandbox-windows-x64.zip
          if-no-files-found: error

  # Runs only when both jobs pass, so a failed build publishes nothing and moves no pin.
  release:
    needs: [wheel-pin, linux, windows]
    # A run from another branch only builds: its commits must not reach master through the pin push.
    if: ${{ !failure() && !cancelled() && github.ref == 'refs/heads/master' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: v1.0.${{ github.run_number }}
    steps:
      # The commit the other jobs built, with history and tags to compare the sandbox against its pinned release.
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.wheel-pin.outputs.sha || github.sha }}
          fetch-depth: 0
      # Not the wheels artifact a wheel rebuild leaves in this run.
      - uses: actions/download-artifact@v4
        with:
          pattern: '{linux,windows}*'
          path: ${{ runner.temp }}/installers
          merge-multiple: true
      # The installers already carry the README's fixed names (desktop/package.json artifactName).
      - name: Re-pin the sandbox and publish
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          built=$(git rev-parse HEAD)
          pin=scripts/tools-setup.mjs
          pinned=$(sed -n "/^export const SANDBOX_RELEASE/,/^};/s/^    tag: '\(.*\)',$/\1/p" "$pin")
          # Every build hashes the zip differently, so the pin moves only when the sandbox source did; a missing tag counts as changed.
          if git diff --quiet "$pinned" HEAD -- desktop/sandbox; then
            echo "The sandbox is unchanged since $pinned; the pin stays."
            moved=
          else
            sha=$(sha256sum "$RUNNER_TEMP/installers/rabbithole-sandbox-windows-x64.zip" | cut -d' ' -f1)
            # Only the two pin values change, directly on the built commit, so the tag's source points at its own zip.
            sed -i -e "/^export const SANDBOX_RELEASE/,/^};/{s/^    tag: '.*',$/    tag: '$TAG',/;s/^    sha256: '.*',$/    sha256: '$sha',/}" "$pin"
            git diff --stat --exit-code -- "$pin" && { echo "The pin did not change."; exit 1; }
            git commit -qm "chore: pin the Windows sandbox to $TAG" -- "$pin"
            moved=$(git rev-parse HEAD)
          fi
          # The tag sits on the built commit or its pin commit, never on code this run did not build.
          git tag "$TAG"
          git push origin "refs/tags/$TAG"
          # A draft first: if any later step fails, nothing is published.
          gh release create "$TAG" "$RUNNER_TEMP"/installers/* --repo "${{ github.repository }}" --verify-tag --draft \
            --title "Rabbithole 1.0.${{ github.run_number }}" \
            --notes "Unsigned AppImage and Windows installer from $built."
          if [ -n "$moved" ]; then
            # If master moved during the run, the same pin change lands on top of it as its own commit.
            git push origin "$moved:refs/heads/master" || {
              git fetch origin master
              git checkout -q FETCH_HEAD
              git cherry-pick "$moved"
              git push origin HEAD:refs/heads/master
            }
          fi
          # Latest, so the README download links and the update banner find it.
          gh release edit "$TAG" --repo "${{ github.repository }}" --draft=false --latest
