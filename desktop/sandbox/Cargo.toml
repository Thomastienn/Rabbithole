[package]
name = "rabbithole-sandbox"
version = "1.0.0"
edition = "2021"
publish = false

# Its own workspace, so the Linux app never fetches the Codex sources.
[workspace]

# Pinned to a Codex release tag; update only on purpose. Cargo.lock starts from
# Codex's own lock at that tag. The crate's helpers must sit beside this launcher:
#   cargo build --release -p rabbithole-sandbox -p codex-windows-sandbox
#     --bin rabbithole-sandbox --bin codex-command-runner --bin codex-windows-sandbox-setup
[target.'cfg(windows)'.dependencies]
codex-windows-sandbox = { git = "https://github.com/openai/codex", tag = "rust-v0.170.0" }
codex-protocol = { git = "https://github.com/openai/codex", tag = "rust-v0.170.0" }
codex-utils-absolute-path = { git = "https://github.com/openai/codex", tag = "rust-v0.170.0" }
tokio = { version = "1", features = ["rt"] }

[profile.release]
strip = true

# Copied from Codex's workspace at the same tag; a git dependency does not inherit its patches.
[patch.crates-io]
tokio-tungstenite = { git = "https://github.com/openai-oss-forks/tokio-tungstenite", rev = "7447c427513cfe685f236e1ac0513c4ea3dd9c0b" }
tungstenite = { git = "https://github.com/openai-oss-forks/tungstenite-rs", rev = "bc589d684755a8c02da0fc7e58d0861cbfc306f1" }
