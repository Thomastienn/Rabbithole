<!doctype html><html lang="en"><head><meta charset="UTF-8"><title>Visual</title><style>html, body { margin: 0; background: transparent; } html { overflow: hidden; } body { display: flow-root; transform-origin: 50% 0; font-family: var(--font-family-body); font-size: var(--text-body-size); line-height: var(--text-body-leading); color: var(--color-text-primary); overflow-wrap: anywhere; } #visual { display: flow-root; } svg[hidden], svg [hidden] { display: none !important; } /* Check yourself (mockup Read): zero specificity so a visual's own styles win. */ :where(details) { margin-block: 16px; padding-block: 16px; border-block: thin solid var(--color-border); } :where(summary) { display: inline-flex; align-items: center; height: 24px; padding: 0 8px; border: thin solid var(--color-border-emphasized); border-radius: var(--radius-element); font-size: 12px; font-weight: 600; cursor: pointer; list-style: none; } :where(summary)::-webkit-details-marker { display: none; } :where(summary):focus-visible { outline: var(--focus-outline-width) solid var(--focus-outline-color); outline-offset: 2px; } :where(details[open] > summary) { margin-block-end: 12px; } :where(.tt-steps) { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; column-gap: 12px; row-gap: 8px; align-items: center; } :where(.tt-steps > [aria-live]) { grid-column: 2; text-align: center; font-size: 12px; color: var(--color-text-secondary); } :where(.tt-steps > button) { display: flex; align-items: center; justify-content: center; width: 40px; height: 40px; padding: 0; border: thin solid var(--color-border-emphasized); border-radius: 50%; background: transparent; color: var(--color-text-primary); cursor: pointer; } :where(.tt-steps > button:hover:not(:disabled)) { background: color-mix(in srgb, currentColor 8%, transparent); } :where(.tt-steps > button:disabled) { opacity: 0.4; cursor: default; } :where(.tt-steps > button):focus-visible { outline: var(--focus-outline-width) solid var(--focus-outline-color); outline-offset: 2px; }</style></head><body><div id="visual"></div><script type="module" src="/src/media/sandbox.ts"></script></body></html>
