<!doctype html><html lang="en"><head><meta charset="UTF-8"><title>Visual</title><style>html, body { margin: 0; background: transparent; } body { display: flow-root; font-family: var(--font-family-body); font-size: var(--text-body-size); line-height: var(--text-body-leading); color: var(--color-text-primary); overflow-wrap: anywhere; } #visual { display: flow-root; } /* Check yourself (mockup Read): zero specificity so a visual's own styles win. */ :where(details) { margin-block: 16px; padding-block: 16px; border-block: thin solid var(--color-border); } :where(summary) { display: inline-flex; align-items: center; height: 24px; padding: 0 8px; border: thin solid var(--color-border-emphasized); border-radius: var(--radius-element); font-size: 12px; font-weight: 600; cursor: pointer; list-style: none; } :where(summary)::-webkit-details-marker { display: none; } :where(summary):focus-visible { outline: var(--focus-outline-width) solid var(--focus-outline-color); outline-offset: 2px; } :where(details[open] > summary) { margin-block-end: 12px; } :where(.tt-steps) { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-block-start: 12px; font-size: 12px; } :where(.tt-steps button) { height: 24px; padding: 0 8px; border: thin solid var(--color-border-emphasized); border-radius: var(--radius-element); background: transparent; color: var(--color-text-primary); font: inherit; font-weight: 600; cursor: pointer; } :where(.tt-steps button:disabled) { opacity: 0.5; cursor: default; } :where(.tt-steps button):focus-visible { outline: var(--focus-outline-width) solid var(--focus-outline-color); outline-offset: 2px; }</style></head><body><div id="visual"></div><script type="module" src="/src/media/sandbox.ts"></script></body></html>
